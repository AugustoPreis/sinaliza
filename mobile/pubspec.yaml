name: mobile
description: "Sinaliza - app do solicitante para abertura e acompanhamento de chamados."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado, injeção e UI base
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  equatable: ^3.0.0
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1

  # Rede e sessão
  dio: ^5.9.0
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  # Versão do app (rodapé do Perfil, suporte no piloto)
  package_info_plus: ^9.0.1

  # Datas e formatação
  intl: ^0.20.2

  # Mídia
  image_picker: ^1.2.2
  flutter_image_compress: ^2.5.1
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  # Abre os ajustes do app quando a permissão de câmera/fotos é negada.
  # 6.x: a 9.x só suporta Swift Package Manager no iOS (o projeto usa CocoaPods).
  app_settings: ^6.1.1

  # Push notifications (task 15)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Manrope-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700

# Ícone do app: `dart run flutter_launcher_icons`
# (PNGs gerados por `flutter test tool/generate_brand_assets_test.dart`).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#0D5C63"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 23

# Splash nativa: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#F5F8F7"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#F5F8F7"
    image: assets/brand/splash_logo.png
  web: false
