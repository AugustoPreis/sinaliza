# NOT a monorepo declaration — this project has no `packages:` field and is
# not part of any workspace. Since pnpm 10, this filename is simply where
# pnpm stores the "which postinstall scripts are allowed to run" allowlist
# (`pnpm approve-builds`), even for a single standalone package.
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  bcrypt: true
  cpu-features: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
