# production-like mode: build final image and run the binary.
# This compose file only covers the API and its own infra (Postgres, Redis,
# MinIO). The web app is a separate, standalone project with its own compose.
#
# Explicit project name: this folder is just called "api", and Compose
# otherwise derives the project name (and therefore volume/network names)
# from the directory basename - colliding with any other unrelated project
# on the same machine that also happens to be named "api".
name: sinaliza-api
services:
  postgres:
    image: postgres:18
    container_name: ${APP_NAME:-sinaliza}_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sinaliza_network

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-sinaliza}_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sinaliza_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${APP_NAME:-sinaliza}_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sinaliza_network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: ${APP_NAME:-sinaliza}_migrate
    command: sh -c "pnpm migration:run && pnpm seed"
    env_file:
      - .env
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sinaliza_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-sinaliza}_api
    env_file:
      - .env
    ports:
      - '${API_HOST_PORT:-3000}:${PORT:-3000}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - sinaliza_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  sinaliza_network:
    driver: bridge
